<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <title>ERROREN CHAT</title>
    <meta name="description" content="Secure, private, real-time messaging, audio/video calls, status stories, groups, and ERROREN AI assistant." />
    <meta property="og:title" content="ERROREN CHAT" />
    <meta property="og:description" content="Secure, private, real-time messaging, audio/video calls, status stories, groups, and ERROREN AI assistant." />
    <meta name="theme-color" content="#070A0F" />
    
    <!-- PWA & Mobile Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ERROREN CHAT" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Single Page App redirect handler for GitHub Pages
      (function(l) {
        if (l.search && l.search.length > 1 && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));

      // Gracefully prevent unhandled promise rejection logs for dev-mode Vite HMR in cloud preview
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
        if (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('[vite]') !== -1) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body style="background-color: #070A0F; color: #F1F5F9; min-height: 100vh; margin: 0;" class="bg-[#070A0F] text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200 overflow-x-hidden font-sans">
    <div id="root">
      <div id="erroren-initial-loader" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #070A0F; color: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
        <style>
          @keyframes erroren-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
        <div style="width: 44px; height: 44px; border: 3px solid rgba(16, 185, 129, 0.2); border-top-color: #10B981; border-radius: 50%; animation: erroren-spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 16px; font-weight: 700; letter-spacing: 0.08em; color: #F8FAFC; text-transform: uppercase;">ERROREN CHAT</div>
        <div id="erroren-loader-msg" style="margin-top: 6px; font-size: 13px; color: #64748B;">Loading secure workspace...</div>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var loader = document.getElementById('erroren-initial-loader');
        var root = document.getElementById('root');
        if (loader && root && root.contains(loader)) {
          var msg = document.getElementById('erroren-loader-msg');
          if (msg) {
            msg.innerHTML = 'Connecting to workspace...<br><button onclick="window.location.reload()" style="margin-top: 12px; padding: 6px 16px; background: rgba(16,185,129,0.2); border: 1px solid rgba(16,185,129,0.4); color: #34D399; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;">Reload App</button>';
          }
        }
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
