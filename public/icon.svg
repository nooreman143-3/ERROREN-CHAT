<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="60" y1="60" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="120" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="6"/>
  
  <!-- Cyber Hexagonal Shield Frame -->
  <path d="M256 70 L410 156 V274 C410 364 344 430 256 454 C168 430 102 364 102 274 V156 Z" 
        stroke="url(#primaryGrad)" stroke-width="12" stroke-linejoin="round" fill="none" opacity="0.9" />

  <!-- Inner Chat Waveform & Encrypted Node -->
  <path d="M170 230 C170 185 208 150 256 150 C304 150 342 185 342 230 C342 270 310 302 270 308 L256 345 L242 308 C198 302 170 270 170 230 Z" 
        fill="url(#accentGrad)" opacity="0.25" />
  
  <path d="M170 230 C170 185 208 150 256 150 C304 150 342 185 342 230 C342 270 310 302 270 308 L256 345 L242 308 C198 302 170 270 170 230 Z" 
        stroke="url(#primaryGrad)" stroke-width="10" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Core Pulse Light Nodes -->
  <circle cx="218" cy="226" r="10" fill="#34D399" />
  <circle cx="256" cy="226" r="10" fill="#38BDF8" />
  <circle cx="294" cy="226" r="10" fill="#C084FC" />
  
  <path d="M208 266 H304" stroke="#10B981" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
</svg>
